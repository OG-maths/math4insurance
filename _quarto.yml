project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!README.md"

lang: en-GB

website:
  title: "Mathematics for Insurance"
  description: "M2 ISIFAR — a course on the mathematical ideas behind insurance"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: outline.qmd
        text: Outline
      - href: reading.qmd
        text: Reading
      - text: Chapters
        menu:
          - href: history.qmd
            text: "1. History"
          - href: micro.qmd
            text: "2. Microeconomics of insurance"
          - href: probability.qmd
            text: "3. Probability for insurance: risk pooling, segmentation and solidarity"
          - href: pricing.qmd
            text: "4. Insurance pricing and risk measures"
          - href: aggregate.qmd
            text: "5. Individual and collective models"
          - href: dependence.qmd
            text: "6. Multivariate risks and copulas"
  page-footer:
    center: "Prof. Olivier Guéant"
  page-navigation: true
  search: true

format:
  html:
    theme:
      - darkly
      - custom.scss
    toc: false
    link-external-newwindow: true
    link-external-icon: false
    code-copy: true
    df-print: kable

execute:
  freeze: auto
  echo: true
  warning: false
